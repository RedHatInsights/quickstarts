openapi: 3.0.3
info:
  title: quickstarts-git-service
  description: Git operations service for creating quickstart PRs
  version: 1.0.0

paths:
  /api/v1/submit-pr:
    post:
      summary: Create a pull request with quickstart content
      operationId: submitPR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitPrRequest'
      responses:
        '200':
          description: PR created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitPrResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/list-quickstarts:
    get:
      summary: List all quickstarts in the repository
      operationId: listQuickstarts
      responses:
        '200':
          description: List of quickstarts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListQuickstartsResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/quickstart-content/{name}:
    get:
      summary: Get the file contents of a specific quickstart
      operationId: getQuickstartContent
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Quickstart directory name
      responses:
        '200':
          description: Quickstart files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickstartContentResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Quickstart not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/creator-prs:
    get:
      summary: List open creator pull requests
      operationId: listCreatorPRs
      responses:
        '200':
          description: Open PRs with head branches starting with qs-create- or qs-update-
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCreatorPRsResponse'
        '502':
          description: GitHub API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/creator-prs/{number}:
    get:
      summary: Get one creator pull request and its quickstart files
      operationId: getCreatorPR
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: integer
          description: GitHub pull request number
      responses:
        '200':
          description: PR metadata and files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorPRContentResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: PR not found, closed, or without a qs-create- or qs-update- head branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: PR changes more than one quickstart; use the workspace endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: GitHub API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/submit-batch-pr:
    post:
      summary: Commit edits across several existing quickstarts to one pull request
      description: >
        Opens a new creator PR when prNumber is omitted, or appends one commit to
        an existing creator PR. Only the files sent are written; nothing is
        pruned, moved, or created.
      operationId: submitBatchPR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchPrRequest'
      responses:
        '200':
          description: Changes committed and pushed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchPrResponse'
        '400':
          description: Invalid request, invalid YAML, unknown quickstart or file, or no changes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: prNumber is not an open creator pull request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The PR branch has new commits, a PR already exists for branchName, or baseSha is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: GitHub API or push error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/creator-prs/{number}/workspace:
    get:
      summary: Get every quickstart a creator pull request touches, read at its head
      operationId: getCreatorPRWorkspace
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: integer
          description: GitHub pull request number
      responses:
        '200':
          description: PR identity and complete quickstart snapshots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorPRWorkspaceResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: PR not found, closed, or not a creator pull request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: PR changes too many files to list completely
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: GitHub API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/creator-prs/{number}/resources/{name}:
    get:
      summary: Get one quickstart read at a creator pull request's head
      operationId: getCreatorPRResource
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: integer
          description: GitHub pull request number
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Quickstart directory name
        - name: headSha
          in: query
          required: false
          schema:
            type: string
          description: Head the caller loaded; 409 if the PR has moved since
      responses:
        '200':
          description: Quickstart files at the PR head
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorPRResourceResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: PR or quickstart not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: PR head does not match headSha
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: GitHub API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /test:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            text/plain:
              schema:
                type: string
                example: OK

components:
  schemas:
    SubmitPrRequest:
      type: object
      required:
        - files
        - metadata
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/File'
        metadata:
          $ref: '#/components/schemas/PrMetadata'

    File:
      type: object
      required:
        - name
        - content
      properties:
        name:
          type: string
          description: File name (e.g. metadata.yaml)
        content:
          type: string
          description: File content

    PrMetadata:
      type: object
      required:
        - branchName
        - commitMessage
        - prTitle
        - prBody
        - userEmail
      properties:
        branchName:
          type: string
          description: Branch name (e.g. quickstart/my-quickstart-1234567890)
        commitMessage:
          type: string
        prTitle:
          type: string
        prBody:
          type: string
        userEmail:
          type: string
          description: User email to mention in PR for notifications
        isUpdate:
          type: boolean
          default: false
          description: true = update existing quickstart, false = create new
        existingPath:
          type: string
          description: Path to existing quickstart directory (required when isUpdate is true)
        directoryName:
          type: string
          description: Directory name for the quickstart (e.g. insights-integrate-satellite-iop). Defaults to branchName if not set.
        prNumber:
          type: integer
          description: Existing PR number; used to return prUrl on force-push update and to refuse creating a second PR if the branch is missing.

    SubmitPrResponse:
      type: object
      properties:
        prUrl:
          type: string
          description: URL of the created pull request
        branchName:
          type: string
        commitSha:
          type: string
        status:
          type: string
          enum: [created, updated, error]

    QuickstartEntry:
      type: object
      properties:
        name:
          type: string
          description: Directory name (e.g. insights-integrate-satellite-iop)
        displayName:
          type: string
          description: Human-readable name from spec.displayName

    ListQuickstartsResponse:
      type: object
      properties:
        quickstarts:
          type: array
          items:
            $ref: '#/components/schemas/QuickstartEntry'
        headSha:
          type: string
          description: Base-branch commit the listing was read from

    QuickstartContentResponse:
      type: object
      properties:
        name:
          type: string
        files:
          type: array
          items:
            $ref: '#/components/schemas/File'
        headSha:
          type: string
          description: Base-branch commit the files were read from

    CreatorPREntry:
      type: object
      properties:
        number:
          type: integer
        title:
          type: string
        htmlUrl:
          type: string
        updatedAt:
          type: string
          format: date-time
        branchName:
          type: string
        slug:
          type: string

    ListCreatorPRsResponse:
      type: object
      properties:
        pullRequests:
          type: array
          items:
            $ref: '#/components/schemas/CreatorPREntry'

    CreatorPRContentResponse:
      type: object
      properties:
        number:
          type: integer
        title:
          type: string
        htmlUrl:
          type: string
        branchName:
          type: string
        slug:
          type: string
        files:
          type: array
          items:
            $ref: '#/components/schemas/File'

    BatchPrRequest:
      type: object
      required:
        - metadata
        - resources
      properties:
        metadata:
          $ref: '#/components/schemas/BatchPrMetadata'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/BatchResource'

    BatchPrMetadata:
      type: object
      required:
        - commitMessage
      properties:
        prNumber:
          type: integer
          description: Existing creator PR to append to; omit to open a new PR
        expectedHeadSha:
          type: string
          description: PR head the edits were made against (required with prNumber)
        branchName:
          type: string
          description: New branch for a first save; must start with qs-update- or qs-create-. Reusing it retries a save whose PR was not opened.
        baseSha:
          type: string
          description: Base-branch commit the files were read from; the new branch starts there
        commitMessage:
          type: string
        prTitle:
          type: string
          description: Required when opening a new PR
        prBody:
          type: string
          description: Defaults to a list of the affected directories
        userEmail:
          type: string

    BatchResource:
      type: object
      required:
        - name
        - files
      properties:
        name:
          type: string
          description: Quickstart directory name
        create:
          type: boolean
          description: The quickstart is new. Its directory must not exist on the branch, and files must be exactly its metadata file and content file, both declaring this name.
        files:
          type: array
          description: Changed files only; omitted files are left untouched. A new quickstart sends all of its files.
          items:
            $ref: '#/components/schemas/File'

    BatchPrResponse:
      type: object
      properties:
        prUrl:
          type: string
        prNumber:
          type: integer
        branchName:
          type: string
        headSha:
          type: string
          description: The new commit, to send as expectedHeadSha on the next save
        status:
          type: string
          enum: [created, updated]
        paths:
          type: array
          items:
            type: string

    ResourceFile:
      type: object
      properties:
        name:
          type: string
        path:
          type: string
          description: Repository-relative path
        content:
          type: string

    WorkspaceResource:
      type: object
      properties:
        name:
          type: string
          description: Quickstart directory name
        path:
          type: string
          description: Repository-relative directory path
        files:
          type: array
          items:
            $ref: '#/components/schemas/ResourceFile'

    CreatorPRWorkspaceResponse:
      type: object
      properties:
        number:
          type: integer
        title:
          type: string
        htmlUrl:
          type: string
        branchName:
          type: string
        headSha:
          type: string
        resources:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceResource'
        missing:
          type: array
          description: Directories the PR touches that no longer exist at its head
          items:
            type: string

    CreatorPRResourceResponse:
      type: object
      properties:
        headSha:
          type: string
        resource:
          $ref: '#/components/schemas/WorkspaceResource'

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
        msg:
          type: string
