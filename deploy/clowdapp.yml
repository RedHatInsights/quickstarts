---
apiVersion: v1
kind: Template
metadata:
  name: quickstarts
objects:
- apiVersion: cloud.redhat.com/v1alpha1
  kind: ClowdApp
  metadata:
    name: quickstarts
  spec:
    envName: ${ENV_NAME}
    database:
      name: quickstarts
      version: 13
    optionalDependencies:
    - rbac
    deployments:
    - name: service
      minReplicas: ${{MIN_REPLICAS}}
      webServices:
        public:
          enabled: true
          apiPath: quickstarts
      podSpec:
        image: ${IMAGE}:${IMAGE_TAG}
        initContainers:
        - name: run-migrations
          command:
            - bash
            - -c
            - quickstarts-migrate
          inheritEnv: true
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /test
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 35
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 120
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /test
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 35
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 120
        env:
        - name: CLOWDER_ENABLED
          value: ${CLOWDER_ENABLED}
        - name: PSK_TOKEN
          valueFrom:
            secretKeyRef:
              name: quickstarts-git-service
              key: PSK_TOKEN
        resources:
          limits:
            cpu: ${CPU_LIMIT}
            memory: ${MEMORY_LIMIT}
          requests:
            cpu: 200m
            memory: 256Mi
        volumes:
        - emptyDir: {}
          name: tmpdir
        volumeMounts:
        - mountPath: /tmp
          name: tmpdir
    - name: git-service
      minReplicas: ${{GIT_SERVICE_MIN_REPLICAS}}
      webServices:
        private:
          enabled: true
      podSpec:
        image: ${GIT_SERVICE_IMAGE}:${GIT_SERVICE_IMAGE_TAG}
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /test
            port: 8001
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /test
            port: 8001
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: quickstarts-git-service
              key: GITHUB_TOKEN
        - name: GITHUB_REPO_URL
          value: ${GITHUB_REPO_URL}
        - name: GITHUB_BASE_BRANCH
          value: ${GITHUB_BASE_BRANCH}
        - name: PR_REVIEWERS_TEAM
          value: ${PR_REVIEWERS_TEAM}
        - name: QUICKSTARTS_REPO_PATH
          value: /var/quickstarts-repo
        - name: QUICKSTARTS_DIR_PATH
          value: ${QUICKSTARTS_DIR_PATH}
        - name: PORT
          value: "8001"
        - name: CLOWDER_ENABLED
          value: ${CLOWDER_ENABLED}
        - name: PSK_TOKEN
          valueFrom:
            secretKeyRef:
              name: quickstarts-git-service
              key: PSK_TOKEN
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        volumes:
        - emptyDir: {}
          name: quickstarts-repo
        volumeMounts:
        - mountPath: /var/quickstarts-repo
          name: quickstarts-repo

parameters:
- name: LOG_LEVEL
  value: Warn
- description: Cpu limit of service
  name: CPU_LIMIT
  value: 500m
- description: memory limit of service
  name: MEMORY_LIMIT
  value: 512Mi
- name: MIN_REPLICAS
  value: '1'
- description: Image tag
  name: IMAGE_TAG
  required: true
- description: Image name
  name: IMAGE
  value: quay.io/redhat-services-prod/hcc-platex-services/quickstarts
- description: Determines Clowder deployment
  name: CLOWDER_ENABLED
  value: "false"
- description: ClowdEnv Name
  name: ENV_NAME
  value: "quickstarts"
  required: true
- name: GIT_SERVICE_MIN_REPLICAS
  value: '1'
- description: Git service image name
  name: GIT_SERVICE_IMAGE
  value: quay.io/redhat-services-prod/hcc-platex-services/quickstarts-git-service
- description: Git service image tag
  name: GIT_SERVICE_IMAGE_TAG
  value: 'latest'
  required: true
- description: GitHub repository URL for git-service
  name: GITHUB_REPO_URL
  value: https://github.com/RedHatInsights/quickstarts
- description: Base branch for PRs
  name: GITHUB_BASE_BRANCH
  value: main
- description: GitHub team slug for PR reviewers
  name: PR_REVIEWERS_TEAM
  value: ""
- description: Directory path for quickstart files within the repo
  name: QUICKSTARTS_DIR_PATH
  value: /docs/quickstarts/